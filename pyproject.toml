[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lob-simulator"
version = "0.1.0"
description = "Limit order book matching engine, agent-based market simulation, and market-making strategy research."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.13; python_version>='3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lob_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
mypy_path = "src"
strict = true
warn_unused_configs = true
exclude = ["^scripts/", "^results/", "^tests/typecheck_fixtures/"]

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
